name: "rm_download_db"
description: Downloads a RepeatMasker/Dfam database file and verifies it against its published MD5 checksum
keywords:
  - repeatmasker
  - dfam
  - download
  - database
tools:
  - "curl":
      description: "curl is a command-line tool for transferring data with URLs, used here to fetch a RepeatMasker/Dfam database file and its MD5 checksum manifest."
      homepage: "https://curl.se/"
      documentation: "https://curl.se/docs/"
      licence: ["curl"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - db_url:
        type: string
        description: URL of the RepeatMasker/Dfam database file to download (a matching "<url>.md5" manifest must also exist)
output:
  h5:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.h5":
          type: file
          description: Downloaded and checksum-verified, decompressed database file
          pattern: "*.h5"
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - "<curl>":
          type: string
          description: The name of the tool
      - curl --version | head -1 | cut -d " " -f2:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - "<curl>":
          type: string
          description: The name of the tool
      - curl --version | head -1 | cut -d " " -f2:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@chriswyatt1"
maintainers:
  - "@chriswyatt1"
