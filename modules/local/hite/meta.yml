name: "hite"
description: Runs HiTE to detect and classify transposable elements in a genome assembly
keywords:
  - transposable elements
  - repeat annotation
  - hite
tools:
  - "hite":
      description: "HiTE is a fast and accurate dynamic boundary adjustment approach for full-length Transposable Element (TE) detection and annotation in genome assemblies."
      homepage: "https://github.com/CSU-KangHu/HiTE"
      documentation: "https://github.com/CSU-KangHu/HiTE"
      tool_dev_url: "https://github.com/CSU-KangHu/HiTE"
      doi: "10.1186/s13059-024-03288-6"
      licence: ["GPL v3"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - fasta:
        type: file
        description: Genome assembly FASTA (gzipped or uncompressed)
        pattern: "*.{fa,fasta,fna}{.gz,}"
output:
  hite_results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*_hite_results":
          type: directory
          description: Full HiTE results directory
  tbl:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*_hite_results/*.tbl":
          type: file
          description: RepeatMasker-style .tbl repeat-composition summary (empty if HiTE found no TEs)
          pattern: "*.tbl"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@chriswyatt1"
maintainers:
  - "@chriswyatt1"
