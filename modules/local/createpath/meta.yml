name: "createpath"
description: Writes a sample's NCBI accession/path identifier to a text file for
  downstream fetch steps
keywords:
  - accession
  - ncbi
  - path
tools:
  - "createpath":
      description: "In-house helper that writes a sample's NCBI accession (or path identifier)
        to a text file, consumed by NCBIGENOMEDOWNLOAD downstream."
      homepage: "https://github.com/nf-core/genomeqc"
      documentation: "https://github.com/nf-core/genomeqc"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', ncbi:'refseq' ]
    - accession:
        type: string
        description: NCBI accession (or path identifier) for the sample
output:
  accession:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', ncbi:'refseq' ]
      - "*.txt":
          type: file
          description: Text file containing the accession/path identifier
          pattern: "*.txt"
          ontologies: []
authors:
  - "@FernandoDuarteF"
  - "@chriswyatt1"
maintainers:
  - "@chriswyatt1"
