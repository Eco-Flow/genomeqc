name: "genomeannotationbuscoideogram"
description: Plots a chromosome ideogram of annotated BUSCO (protein-mode) gene locations, matched against the genome annotation GFF
keywords:
  - busco
  - ideogram
  - annotation
  - rideogram
tools:
  - "genomeannotationbuscoideogram":
      description: "In-house step that builds a chromosome karyotype from the genome FASTA, matches protein-mode BUSCO hits back onto genomic coordinates via the annotation GFF, and renders an RIdeogram plot of their locations."
      homepage: "https://github.com/nf-core/genomeqc"
      documentation: "https://github.com/nf-core/genomeqc"
      licence: ["MIT"]
input:
  - - genusspeci:
        type: string
        description: Genus/species identifier used to tag and prefix outputs
    - lineage:
        type: string
        description: BUSCO lineage dataset name used to tag outputs
    - busco_full_table:
        type: file
        description: Protein-mode BUSCO full_table.tsv (no genomic coordinate columns; gene IDs are matched via the GFF)
        pattern: "full_table.tsv"
    - genome:
        type: file
        description: Genome FASTA, used to build the chromosome karyotype
        pattern: "*.{fa,fasta,fna}"
    - gff:
        type: file
        description: Genome annotation GFF, used to map BUSCO protein hits back onto genomic coordinates
        pattern: "*.{gff,gff3}"
output:
  svg:
    - - genusspeci:
          type: string
          description: Genus/species identifier used to tag and prefix outputs
      - lineage:
          type: string
          description: BUSCO lineage dataset name used to tag outputs
      - "*.svg":
          type: file
          description: SVG chromosome ideogram of annotated BUSCO gene locations
          pattern: "*.svg"
  png:
    - - genusspeci:
          type: string
          description: Genus/species identifier used to tag and prefix outputs
      - lineage:
          type: string
          description: BUSCO lineage dataset name used to tag outputs
      - "*.png":
          type: file
          description: PNG chromosome ideogram of annotated BUSCO gene locations
          pattern: "*.png"
  busco_mappings:
    - - genusspeci:
          type: string
          description: Genus/species identifier used to tag and prefix outputs
      - "*.csv":
          type: file
          description: Per-chromosome count of Complete BUSCOs
          pattern: "*.csv"
  versions_r_base:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r_base:
          type: string
          description: The name of the tool
      - Rscript -e "cat(as.character(getRversion()))":
          type: eval
          description: The expression to obtain the version of the tool
  versions_rideogram:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r_rideogram:
          type: string
          description: The name of the tool
      - "Rscript -e \"cat(as.character(packageVersion('RIdeogram')))\"":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r_base:
          type: string
          description: The name of the tool
      - Rscript -e "cat(as.character(getRversion()))":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - r_rideogram:
          type: string
          description: The name of the tool
      - "Rscript -e \"cat(as.character(packageVersion('RIdeogram')))\"":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@chriswyatt1"
maintainers:
  - "@chriswyatt1"
